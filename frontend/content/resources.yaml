    - slug: emergency-food-network
      title: Emergency Food Network
      type: PANTRY
      description: 3 days' supply, 1x/month
      location: Emergency Food Network
      address: 900 Harris St
      phone: 434-979-9180
      hours:
          Call once per month between 9am and noon on Mondays, Wednesdays, and
          Fridays. Pick up same day 1:30-3:30pm
      requirements:
          Must provide last 4 digits of SSN, household size, and address. Must
          live in Charlottesville or Albemarle county.
      notes:
          Includes canned tuna and chicken, fruits, vegetables, cereal, beans,
          soup, peanut butter, mac and cheese, bread, margarine, cheese, and
          milk. Special diabetic bags available. Baby food and formula if
          available. Diapers available. Ready-to-eat foods for those without
          kitchens. Individuals with a social worker can request food more
          often. No delivery available. Updated 8/8/25
      lastUpdated: 2025-11-13

    - slug: loaves-and-fishes
      title: Loaves and Fishes
      type: PANTRY
      description:
          7 days' supply, 2x/month. At minimum 100 lbs for 4-person household.
      location: Loaves and Fishes
      address: 2050 Lambs Road, Charlottesville, VA 22901
      phone: 434-996-7868
      hours:
          'Distribution: Wednesdays (2-4pm), Thursdays (6:30-8:30pm), Saturdays
          (10am-12pm). Groceries by Appointment: Tuesdays 4-7pm'
      requirements:
          Need names and birthdates of all household members plus total monthly
          income. No proof required.
      notes:
          'Drive-through pick-up only. Parking lot opens one hour before
          distribution. Includes fresh eggs, milk, produce, bread, frozen meats,
          and shelf-stable staples. Families can come twice a month or more if
          needed. Pick-ups can be done by someone else on behalf of family (must
          be arranged by family). Groceries by Appointment: Make 15-minute
          reservation online between 12:00am Wednesday - Monday 11:59pm for
          upcoming Tuesday. Updated 8/8/25'
      lastUpdated: 2025-11-13

